name: Sync Core
run-name: Sync with channel-volume-core 🔄

# Once a day, and when run by hand: where channel-volume-core's main has moved
# past the commit core.json locks, tools/sync-core.sh opens or updates the pull
# request that takes it. A GitHub App's token makes the push and the pull
# request, so the extension's checks run on them. The job is skipped where the
# repository has no SYNC_APP_CLIENT_ID variable.
on:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync 🔄
    if: vars.SYNC_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Make The App's Token 🔑
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        timeout-minutes: 5
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Set Up Node 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Fetch channel-volume-core 📥
        timeout-minutes: 5
        run: git clone -q --depth 1 https://github.com/semnil/channel-volume-core "$RUNNER_TEMP/core"

      # The commit is the App's, under the name and address GitHub gives its
      # bot account.
      - name: Open Or Update The Pull Request 🔄
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          export SYNC_GIT_NAME="${SLUG}[bot]"
          export SYNC_GIT_EMAIL="${id}+${SLUG}[bot]@users.noreply.github.com"
          bash tools/sync-core.sh "$RUNNER_TEMP/core"
