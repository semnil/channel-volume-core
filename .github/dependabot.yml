version: 2
# Every entry runs every day at 00:00 JST on a cron schedule; `interval: daily`
# runs on weekdays only.
updates:
  # The actions this repository's workflows use, and the ones the workflows
  # under shared/ use in the extensions. The extensions run no Dependabot of
  # their own: an update reaches them as any change to a shared file does.
  - package-ecosystem: github-actions
    directories:
      - /
      - /shared/.github/workflows
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: "Asia/Tokyo"
